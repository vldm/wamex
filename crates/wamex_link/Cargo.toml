[package]
name = "wamex_link"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3" }
thiserror = "2.0"

wamex_metadata = { version = "0.1.0", path = "../wamex_metadata" }
# TODO: use smaller serialization crate
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
