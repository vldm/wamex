[package]
name = "wamex_link"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "^0.2.104"
web-sys = { version = "0.3", features = ["Request", "Response", "Window"] }
js-sys = "0.3"
futures = "0.3"
thiserror = "2.0"
wamex_types = { version = "0.1.0", path = "../wamex_types", features = [
    "parser",
] }
wasmparser = "0.238.0"

# Under debug feature
log = { version = "0.4", optional = true }


[features]
default = ["debug"]
debug = ["dep:log"]
bindgen_refetch = [] # generate wasm-bindgen mark_for_update helper
