[package]
name = "wamex_metadata"
version = "0.1.0"
edition = "2024"

[dependencies]

serde_json = { version = "1.0.104" }
serde = { version = "1.0.130", features = ["derive"] }
nom = { version = "8.0.0", features = ["std"] }
rustc-demangle = { version = "0.1.24", optional = true }
wasmparser = { version = "0.238.0", optional = true }

[features]
default = ["full"]
# Symbol demangling and covnersion from wasmparser types
full = ["dep:rustc-demangle", "dep:wasmparser"]
