[package]
name = "example"
version = "0.1.0"
authors = ["Jeremy Maitin-Shepard <jeremy@jeremyms.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.82"
async-compression = { version = "0.4.8", features = ["futures-io"] }
futures = "0.3.30"
js-sys = "0.3.69"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.42"
wasm-streams = "0.4.0"
wamex = { path = "../wamex", optional = true }
wasm-log = "0.3"


[features]
default = ["split"]
split = ["dep:wamex"]
gzip = ["async-compression/gzip"]
brotli = ["async-compression/brotli"]
