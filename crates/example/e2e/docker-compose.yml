version: '3'
services:
  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
      - "7900:7900"  # VNC server (optional, for debugging)
    shm_size: 2gb
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux compatibility
    environment:
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_SESSION_TIMEOUT=300
